name: Pipeline ML
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Entrenar los dos modelos
        run: python src/train.py
      - name: Ejecutar pruebas
        run: python -m pytest tests -v
      - name: Conservar modelos y métricas
        uses: actions/upload-artifact@v4
        with:
          name: modelos-ventas
          path: models/
      - name: Comprobar construcción Docker
        run: docker build -t mlops-ventas:ci .
